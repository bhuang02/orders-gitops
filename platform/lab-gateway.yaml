apiVersion: networking.istio.io/v1
kind: Gateway
metadata:
  name: lab-gateway
  namespace: istio-ingress
spec:
  # Verify the ingress gateway Pod labels; adjust this selector if different.
  selector:
    istio: ingress
  servers:
    - port:
        number: 80
        name: http
        protocol: HTTP
      hosts:
        - orders-progressive.lab.test
